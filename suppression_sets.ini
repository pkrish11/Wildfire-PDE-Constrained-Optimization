; Hyperparameter sets for the water / retardant suppression tests.
; Read by run_suppression_sweep.py (configparser). Lines starting with ; are comments.
;
; Spray model:  temp term  = -k     * S * u_s * tanh(u / u_s)
;               fuel term  = -delta * S * b_s * tanh(beta / b_s)
;               S = sum_i Theta_i(t) psi_i(x, y, t)   (moving Gaussian, plane speed v)
; Derived per-pass quantities (point at the middle of the flight path):
;   tau  = sigma*sqrt(2*pi)/v                      exposure
;   C_w  = k * u_s * tau                           max heat removed per pass [u-units]
;   fuel left after one pass for grass 0.2 / shrub 0.45 / asset 0.7 / forest 0.9
; For reference, burning a cell releases (q/eps)*beta0 = 0.67 / 1.5 / 2.33 / 3.0 u-units.

[common]
; model
kap   = 1.0
eps   = 0.3
q     = 1.0
; heat-loss coefficients to compare (alpha sweep: 0.017 ~ paper-like, 0.06 / 0.09 = stronger breaks)
alphas = 0.017, 0.06, 0.09
; numerics
t_max = 20
nx    = 200
nt    = 175
; RK4 + 3rd-order upwind is unstable at wind 10 with nt = 175 over t = 20 (needs nt >= 199)
nt_override_wind10 = 300
winds = 4, 6, 10
; plane speed
v = 5
; two fire-break drops (perpendicular to the 45 deg fire path): x_start, y_start, heading, t_start
drop1 = 13.5, 8.5, 2.35619449, 0.0
drop2 = 11.5, -9.5, 2.35619449, 3.5

[A1_water]
; realistic water: heat sink ~15-30 % of fuel energy per pass, almost no lasting fuel effect
; tau = 1.48, C_w = 0.59, fuel left 88 / 91 / 94 / 95 %
sigma = 3.0
T     = 3.0
k     = 0.4
delta = 0.1
u_s   = 1.0
b_s   = 0.3

[A1_retardant]
; realistic long-term retardant: same heat sink as water, neutralises most light fuel
; tau = 1.48, C_w = 0.59, fuel left 24 / 31 / 43 / 52 %
sigma = 3.0
T     = 3.0
k     = 0.4
delta = 1.0
u_s   = 1.0
b_s   = 0.3

[A2_optimisation]
; tuned for the optimizer; sigma reduced 7 -> 4.5 so a break does not cover the 12-unit gap
; between the two assets
; tau = 2.13, C_w = 1.28, fuel left 30 / 38 / 49 / 58 %
sigma = 4.5
T     = 3.5
k     = 0.4
delta = 0.6
u_s   = 1.5
b_s   = 0.3
